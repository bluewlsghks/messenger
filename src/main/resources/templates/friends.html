<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>친구 · Messenger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="/js/auth.js"></script><script defer src="/js/friends.js"></script>
</head>
<body class="bg-zinc-900 text-zinc-100 h-screen flex flex-col">
  <header class="h-14 bg-zinc-950 flex items-center px-4 border-b border-zinc-800 gap-3">
    <h1 class="text-lg font-semibold flex-1">친구</h1>
    <a href="/home" class="text-sm text-zinc-400 hover:text-zinc-200">← 홈</a>
    <a href="/servers" class="text-sm text-indigo-300">서버</a>
    <button id="logoutBtn" class="text-sm text-zinc-400 hover:text-red-400 ml-3">로그아웃</button>
  </header>
  <main class="flex-1 p-4 space-y-6 overflow-y-auto">
    <section class="bg-zinc-800/50 rounded-xl p-4 border border-zinc-700">
      <h2 class="text-base font-semibold mb-3">아이디로 친구 추가</h2>
      <div class="flex gap-2">
        <input id="friendId" class="flex-1 bg-zinc-800 text-zinc-100 rounded-lg p-2 outline-none" placeholder="친구 ID를 입력하세요">
        <button id="addFriendBtn" class="bg-sky-600 px-4 py-2 rounded-lg text-white">추가</button>
        <button id="startDmBtn" class="bg-emerald-600 px-4 py-2 rounded-lg text-white">DM 시작</button>
      </div>
      <p id="friendMsg" class="text-sm text-zinc-400 mt-2" role="status"></p>
    </section>
    <section class="bg-zinc-800/50 rounded-xl p-4 border border-zinc-700">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-base font-semibold">내 친구</h2>
        <button id="reloadBtn" class="text-sm text-zinc-300 hover:text-white">새로고침</button>
      </div>
      <ul id="friendList" class="divide-y divide-zinc-800"></ul>
    </section>
  </main>
</body>
</html>
