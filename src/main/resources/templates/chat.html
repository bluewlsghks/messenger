<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>채팅 · Messenger</title><link rel="stylesheet" href="/css/messenger.css">
  <script defer src="/js/auth.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  <script defer src="/js/conversation.js"></script>
</head>
<body class="chat-only" data-page="chat">
  <main class="conversation">
    <header class="chat-header"><a href="/home">← DM 목록</a><a href="/servers">서버</a><h1 id="chat-title">대화방</h1><span id="connection-state" role="status">연결 중</span><button id="logoutBtn">로그아웃</button></header>
    <p id="chat-error" class="error" role="alert" hidden></p>
    <div class="history-tools"><button id="load-older" disabled>이전 메시지 더 보기</button></div>
    <div id="message-list" class="message-list" aria-label="대화 내역" tabindex="0"></div>
    <form id="message-form" class="composer"><label class="sr-only" for="message-input">메시지</label><textarea id="message-input" maxlength="4000" rows="2" placeholder="메시지 입력 · Enter 전송 / Shift+Enter 줄바꿈" disabled></textarea><button id="send-message" type="submit" disabled>전송</button></form>
  </main>
</body>
</html>
