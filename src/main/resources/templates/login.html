<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:," /> <!-- favicon 요청 차단 -->
    <script src="/js/auth.js" defer></script>
</head>
<body class="bg-zinc-900 text-zinc-100 flex items-center justify-center h-screen">
<div class="bg-zinc-800 p-8 rounded-2xl shadow-lg w-full max-w-sm">
    <h2 class="text-2xl font-semibold mb-6 text-center">로그인</h2>

    <form id="loginForm" class="space-y-4">
        <div>
            <label class="block mb-1 text-sm">아이디</label>
            <input id="id" name="id" type="text"
                   class="w-full rounded-lg p-2 bg-zinc-700 border border-zinc-600 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                   placeholder="아이디를 입력하세요" required />
        </div>

        <div>
            <label class="block mb-1 text-sm">비밀번호</label>
            <input id="password" name="password" type="password"
                   class="w-full rounded-lg p-2 bg-zinc-700 border border-zinc-600 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                   placeholder="비밀번호를 입력하세요" required />
        </div>

        <button type="submit"
                class="w-full bg-emerald-600 hover:bg-emerald-500 rounded-lg py-2 font-semibold text-white">
            로그인
        </button>

        <p class="text-center text-sm text-zinc-400 mt-4">
            아직 회원이 아니신가요?
            <a href="/register" class="text-emerald-400 hover:text-emerald-300">회원가입</a>
        </p>
    </form>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("id").value;
      const password = document.getElementById("password").value;

      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, password })
      });

      if (res.ok) {
        const data = await res.json();

        // ✅ [추가] 로그인 성공 시 사용자 정보 로컬스토리지에 저장
        Auth.setAuth(data);

        alert(`${data.userName}님 환영합니다!`);
        window.location.href = "/home"; // ✅ 로그인 후 메인 화면 이동
      } else {
        const err = await res.json().catch(() => ({}));
        alert(err.message || "로그인 실패. 아이디/비밀번호를 확인하세요.");
      }
    });
</script>

</body>
</html>
