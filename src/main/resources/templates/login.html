<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 · Messenger</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/css/workspace.css"><script src="/js/auth.js" defer></script><script src="/js/auth-page.js" defer></script></head><body class="auth-page" data-auth-mode="login"><main class="auth-shell"><section class="auth-story"><div class="auth-logo">messenger<span style="color:#aa9df4">.</span></div><div><h1>함께하는 순간을,<br>하나의 공간에.</h1><p>친구와 가볍게 나누는 안부부터<br>관심사가 모이는 우리만의 채널까지.</p></div><small>친구 · 다이렉트 메시지 · 서버 · 텍스트 채널</small></section><section class="auth-form-panel"><h2>다시 만나 반가워요</h2><p>로그인하고 대화를 이어가세요.</p><form id="auth-form"><label class="form-field">아이디<input id="login-id" name="id" autocomplete="username" required maxlength="100" placeholder="사용자 아이디"></label><label class="form-field">비밀번호<div class="password-control"><input id="login-password" name="password" type="password" autocomplete="current-password" required><button id="show-password" type="button" aria-label="비밀번호 표시" aria-pressed="false">보기</button></div></label><p id="auth-error" class="dialog-error" role="alert"></p><button id="auth-submit" type="submit" class="primary">로그인</button></form><div class="auth-switch">아직 계정이 없나요?<a href="/register">회원가입</a></div></section></main></body></html>
