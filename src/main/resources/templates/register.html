<!-- src/main/resources/templates/register.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>회원가입 · Messenger</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," /> <!-- favicon 요청 차단 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { height: 100%; }
        input, button { outline: none; }
    </style>
</head>
<body class="min-h-full bg-zinc-900 text-zinc-100">
<main class="min-h-screen grid place-items-center px-4">
    <div class="w-full max-w-md bg-zinc-950 border border-zinc-800 rounded-2xl p-6 shadow-xl">
        <h1 class="text-xl font-semibold mb-1">회원가입</h1>
        <p class="text-sm text-zinc-400 mb-6">간단히 아이디/이름/비밀번호/휴대폰만 입력하세요.</p>

        <!-- 알림 영역 -->
        <div id="alert" class="hidden mb-4 rounded-lg p-3 text-sm"></div>

        <form id="registerForm" class="space-y-4">
            <div>
                <label for="loginId" class="block text-sm mb-1">아이디 (영문/숫자 4~20)</label>
                <input id="loginId" name="loginId" autocomplete="username"
                       class="w-full rounded-lg bg-zinc-800 border border-zinc-700 px-3 py-2"
                       placeholder="예: bluewlsghks" required minlength="4" maxlength="20">
            </div>

            <div>
                <label for="userName" class="block text-sm mb-1">이름</label>
                <input id="userName" name="userName"
                       class="w-full rounded-lg bg-zinc-800 border border-zinc-700 px-3 py-2"
                       placeholder="예: LEE" required maxlength="30">
            </div>

            <div>
                <label for="password" class="block text-sm mb-1">비밀번호 (8자 이상)</label>
                <input id="password" name="password" type="password" autocomplete="new-password"
                       class="w-full rounded-lg bg-zinc-800 border border-zinc-700 px-3 py-2"
                       placeholder="영문/숫자/특수문자 조합 권장" required minlength="8" maxlength="64">
            </div>

            <div>
                <label for="phoneNumber" class="block text-sm mb-1">휴대폰 번호</label>
                <input id="phoneNumber" name="phoneNumber" inputmode="tel"
                       class="w-full rounded-lg bg-zinc-800 border border-zinc-700 px-3 py-2"
                       placeholder="010-1234-5678 또는 01012345678" required maxlength="20">
                <p class="text-xs text-zinc-500 mt-1">※ 서버에서 AES 암호화 저장됩니다.</p>
            </div>

            <button id="submitBtn" type="submit"
                    class="w-full rounded-lg bg-emerald-700 hover:bg-emerald-600 disabled:opacity-50 disabled:cursor-not-allowed px-3 py-2 font-medium">
                가입하기
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-zinc-500">
            이미 계정이 있으신가요?
            <a th:href="@{/login}" class="text-emerald-400 hover:underline">로그인</a>
        </div>
    </div>
</main>

<script>
    // 간단 유효성 검사 & 포맷터
    function normalizeLoginId(id) {
      return (id || '').trim();
    }
    function normalizeUserName(nm) {
      return (nm || '').trim();
    }
    function normalizePhone(phone) {
      // 숫자만 추출 후 010-XXXX-XXXX 형태로 포맷
      const digits = (phone || '').replace(/\\D+/g, '').slice(0, 11);
      if (digits.length === 11 && digits.startsWith('010')) {
        return digits.replace(/(\\d{3})(\\d{4})(\\d{4})/, '$1-$2-$3');
      }
      // 그 외는 원문 유지(백엔드에서 한 번 더 정규화/검증)
      return phone.trim();
    }

    function showAlert(msg, type) {
      const el = document.getElementById('alert');
      el.textContent = msg;
      el.classList.remove('hidden', 'bg-red-900/40', 'text-red-200', 'bg-emerald-900/40', 'text-emerald-200');
      if (type === 'success') el.classList.add('bg-emerald-900/40', 'text-emerald-200');
      else el.classList.add('bg-red-900/40', 'text-red-200');
    }

    function clearAlert() {
      const el = document.getElementById('alert');
      el.classList.add('hidden');
      el.textContent = '';
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '처리 중...';

      const loginId = normalizeLoginId(document.getElementById('loginId').value);
      const userName = normalizeUserName(document.getElementById('userName').value);
      const password = document.getElementById('password').value || '';
      const phoneNumber = normalizePhone(document.getElementById('phoneNumber').value);

      // 프론트 1차 검증(간단)
      if (!/^[a-zA-Z0-9_\\-]{4,20}$/.test(loginId)) {
        showAlert('아이디는 영문/숫자/언더스코어/하이픈 4~20자로 입력하세요.', 'error');
        btn.disabled = false; btn.textContent = '가입하기';
        return;
      }
      if (password.length < 8) {
        showAlert('비밀번호는 8자 이상이어야 합니다.', 'error');
        btn.disabled = false; btn.textContent = '가입하기';
        return;
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: loginId, userName, password, phoneNumber })
        });

        // 백엔드에서 IllegalArgumentException → 400으로 매핑했다면 여기서 처리
        const text = await res.text();
        let data = {};
        try { data = JSON.parse(text); } catch(_) { /* text 그대로 사용 */ }

        if (!res.ok) {
          const msg = (data && (data.message || data.error)) || text || '가입에 실패했습니다.';
          showAlert(msg, 'error');
          btn.disabled = false; btn.textContent = '가입하기';
          return;
        }

        // 성공
        showAlert('회원가입이 완료되었습니다. 로그인 페이지로 이동합니다.', 'success');
        setTimeout(() => {
          // 필요한 경로로 이동
          window.location.href = '/login';
        }, 1000);

      } catch (err) {
        console.error(err);
        showAlert('네트워크 오류가 발생했습니다.', 'error');
        btn.disabled = false; btn.textContent = '가입하기';
      }
    });
</script>
</body>
</html>
