<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 · Messenger</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/css/workspace.css"><script src="/js/auth.js" defer></script><script src="/js/auth-page.js" defer></script></head><body class="auth-page" data-auth-mode="register"><main class="auth-shell"><section class="auth-story"><div class="auth-logo">messenger<span style="color:#aa9df4">.</span></div><div><h1>새로운 대화가<br>기다리고 있어요.</h1><p>계정을 만들고 친구를 초대하세요.<br>우리만의 공간은 작은 인사에서 시작됩니다.</p></div><small>친구 · 다이렉트 메시지 · 서버 · 텍스트 채널</small></section><section class="auth-form-panel"><h2>계정 만들기</h2><p>다른 사람에게 보일 이름과 로그인 정보를 입력하세요.</p><form id="auth-form"><label class="form-field">아이디<input id="login-id" name="id" autocomplete="username" required maxlength="100" placeholder="사용자 아이디"></label><label class="form-field">표시 이름<input name="userName" autocomplete="nickname" required maxlength="40" placeholder="대화에서 사용할 이름"></label><label class="form-field">전화번호<input name="phoneNumber" type="tel" autocomplete="tel" required pattern="[0-9+\-]{9,20}" maxlength="20" placeholder="01012345678"></label><label class="form-field">비밀번호<div class="password-control"><input id="login-password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72"><button id="show-password" type="button" aria-label="비밀번호 표시" aria-pressed="false">보기</button></div></label><label class="form-field">비밀번호 확인<input name="passwordConfirm" type="password" autocomplete="new-password" required></label><p id="auth-error" class="dialog-error" role="alert"></p><button id="auth-submit" type="submit" class="primary">회원가입</button></form><div class="auth-switch">이미 계정이 있나요?<a href="/login">로그인</a></div></section></main></body></html>
