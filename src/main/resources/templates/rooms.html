<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>??붾갑 紐⑸줉</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:," /> <!-- favicon ?붿껌 李⑤떒 -->
    <!-- ??怨듯넻 Auth JS 遺덈윭?ㅺ린 -->
    <script src="/js/auth.js" defer></script>
</head>

<body class="bg-zinc-900 text-zinc-100 h-screen flex flex-col">
<header class="bg-zinc-950 border-b border-zinc-800 p-4 flex justify-between items-center">
    <h1 class="text-lg font-semibold">????붾갑</h1>
    <button id="logoutBtn" class="text-sm text-zinc-400 hover:text-red-400">濡쒓렇?꾩썐</button>
</header>

<main id="roomList" class="flex-1 overflow-y-auto p-4 space-y-3">
    <p class="text-zinc-400 text-sm text-center">遺덈윭?ㅻ뒗 以?..</p>
</main>

<footer class="border-t border-zinc-800 p-3 bg-zinc-950 text-center text-sm text-zinc-500">
    짤 2025 Messenger
</footer>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
      // ??濡쒓렇???꾩닔
      if (!Auth.requireLogin()) return;

        // ??濡쒓렇?꾩썐 踰꾪듉 ?대깽???곌껐
        Auth.attachLogoutButton("logoutBtn");

        const token = Auth.getToken();
        const userName = Auth.getUserName();
        const listEl = document.getElementById("roomList");

      try {
        const res = await fetch("/api/rooms/my", {
          headers: { "Authorization": "Bearer " + token }
        });

        if (!res.ok) {
          listEl.innerHTML = "<p class='text-red-400 text-center mt-8'>諛?紐⑸줉??遺덈윭?ㅼ? 紐삵뻽?듬땲??</p>";
          return;
        }

        const rooms = await res.json();
        if (rooms.length === 0) {
          listEl.innerHTML = "<p class='text-zinc-400 text-center mt-8'>李몄뿬 以묒씤 ??붾갑???놁뒿?덈떎.</p>";
          return;
        }

        listEl.innerHTML = "";
        rooms.forEach(r => {
          const div = document.createElement("div");
          div.className = "p-3 bg-zinc-800 hover:bg-zinc-700 rounded-lg cursor-pointer";
          div.textContent = `${r.type} | ${r.members.join(", ")}`;
          div.onclick = () => location.href = `/chat/${r.id}`;
          listEl.appendChild(div);
        });
      } catch (err) {
        console.error(err);
        listEl.innerHTML = "<p class='text-red-400 text-center mt-8'>?쒕쾭 ?ㅻ쪟媛 諛쒖깮?덉뒿?덈떎.</p>";
      }
    });
</script>
</body>
</html>
