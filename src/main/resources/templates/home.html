<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>메신저 홈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:," />
    <script src="/js/auth.js" defer></script>
    <script src="/js/friends.js" defer></script>
    <script src="/js/home.js" defer></script>
</head>
<body class="bg-zinc-900 text-zinc-100 h-screen flex flex-col">
<header class="bg-zinc-950 border-b border-zinc-800 p-4 flex justify-between items-center">
    <h1 class="text-lg font-semibold">Messenger</h1>
    <a href="/servers" class="text-sm text-indigo-300 hover:text-white">서버 · 채널 열기 →</a>
    <button id="logoutBtn" class="text-sm text-zinc-400 hover:text-red-400">로그아웃</button>
</header>
<nav class="flex border-b border-zinc-800 bg-zinc-950 text-sm">
    <button id="tabRooms" class="flex-1 py-3 text-center border-b-2 border-emerald-600 text-emerald-400 font-semibold">대화</button>
    <button id="tabFriends" class="flex-1 py-3 text-center border-b-2 border-transparent hover:text-zinc-300">친구</button>
</nav>
<main class="flex-1 overflow-y-auto p-4 space-y-4">
    <section id="roomsTab" class="space-y-4">
        <div class="bg-zinc-800/50 rounded-xl p-4 border border-zinc-700">
            <h2 class="text-base font-semibold mb-2">그룹방 생성</h2>
            <p class="text-sm text-zinc-400 mb-2">쉼표(,)로 멤버 ID를 입력하세요. (본인 자동 포함 · 최소 3명)</p>
            <div class="flex gap-2">
                <input id="groupMembers" class="flex-1 bg-zinc-800 text-zinc-100 rounded-lg p-2 outline-none" placeholder="예: LEE, CHA, PARK">
                <button id="createGroupBtn" class="bg-purple-600 px-4 py-2 rounded-lg text-white">생성</button>
            </div>
            <p id="groupMsg" class="text-sm text-zinc-400 mt-2" role="status"></p>
        </div>
        <div class="space-y-3" id="roomList"><p class="text-zinc-400 text-sm text-center">불러오는 중...</p></div>
    </section>
    <section id="friendsTab" class="hidden space-y-6">
        <div class="bg-zinc-800/50 rounded-xl p-4 border border-zinc-700">
            <h2 class="text-base font-semibold mb-3">아이디로 친구 추가</h2>
            <div class="flex gap-2">
                <input id="friendId" class="flex-1 bg-zinc-800 text-zinc-100 rounded-lg p-2 outline-none" placeholder="친구 ID (예: LEE)">
                <button id="addFriendBtn" class="bg-sky-600 px-4 py-2 rounded-lg text-white">추가</button>
                <button id="startDmBtn" class="bg-emerald-600 px-4 py-2 rounded-lg text-white">DM</button>
            </div>
            <p id="friendMsg" class="text-sm text-zinc-400 mt-2" role="status"></p>
        </div>
        <div class="bg-zinc-800/50 rounded-xl p-4 border border-zinc-700">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-base font-semibold">내 친구</h2>
                <button id="reloadBtn" class="text-sm text-zinc-300 hover:text-white">새로고침</button>
            </div>
            <ul id="friendList" class="divide-y divide-zinc-800"><li class="p-3 text-zinc-400">불러오는 중...</li></ul>
        </div>
    </section>
</main>
<footer class="border-t border-zinc-800 p-3 bg-zinc-950 text-center text-sm text-zinc-500">Messenger</footer>
</body>
</html>
