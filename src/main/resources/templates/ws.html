<script>
    // ===== Utils =====
    function genId(){ return String(Date.now()) + '-' + Math.floor(Math.random()*1e9); }
    function nowHHMM(){ return new Date().toTimeString().slice(0,5); }

    // A tiny TTL set for de-dup (keeps last N keys for M ms)
    function makeTTLSet(limit, ttlMs){
      const map = new Map(); // key -> expiry
      function prune(){
        const t = Date.now();
        for(const [k,exp] of map){ if(exp <= t) map.delete(k); }
        // size bound
        while(map.size > limit){ const first = map.keys().next().value; map.delete(first); }
      }
      return {
        has(k){ prune(); return map.has(k); },
        add(k){ prune(); map.set(k, Date.now()+ttlMs); },
        size(){ prune(); return map.size; }
      };
    }

    class ErrorBoundary extends React.Component {
      constructor(p){ super(p); this.state = {hasError:false, error:null}; }
      static getDerivedStateFromError(err){ return {hasError:true, error:err}; }
      componentDidCatch(err, info){ console.error('UI Error:', err, info); }
      render(){ if(this.state.hasError){ return React.createElement('div',{className:'p-4 text-red-300'},'?Œë”ë§??¤ë¥˜: '+(this.state.error&& (this.state.error.message||String(this.state.error)))); } return this.props.children; }
    }

    function Notice(props){
      return React.createElement('div',{className:'flex-1 grid place-items-center p-8'},
        React.createElement('div',{className:'max-w-xl w-full bg-zinc-950 border border-zinc-800 rounded-2xl p-6'},[
          React.createElement('div',{key:'t',className:'text-lg font-semibold mb-1'},props.title),
          React.createElement('div',{key:'d',className:'text-sm text-zinc-400 whitespace-pre-wrap'},props.detail),
          props.action?React.createElement('div',{key:'a'},props.action):null
        ])
      );
    }

    function DMApp(){
      const rootEl = document.getElementById('app');
      const roomId = (rootEl && rootEl.dataset && rootEl.dataset.roomId) ? rootEl.dataset.roomId : 'room1';
      const me     = (rootEl && rootEl.dataset && rootEl.dataset.me) ? rootEl.dataset.me : 'ME';
      const wsBase = (rootEl && rootEl.dataset && rootEl.dataset.ws) ? rootEl.dataset.ws : '/ws-stomp';

      const useState = React.useState, useRef = React.useRef, useEffect = React.useEffect;
      const [messages, setMessages]   = useState([]);
      const [draft, setDraft]         = useState('');
      const [connected, setConnected] = useState(false);
      const [probe, setProbe]         = useState({ done:false, ok:false, status:null, error:null, body:null });
      const scrollRef = useRef(null);

      // ?’¡ de-dup state: per-tab clientId + recentlySeen keys
      const clientId = React.useMemo(()=> genId(), []);
      const seenRef  = useRef(makeTTLSet(200, 8000)); // keep last 200 keys for 8s
      function msgKey(m){ return [m.sender||'', m.content||'', m.ts||''].join('|'); }

      // probe /info
      useEffect(function(){
        var base = wsBase; if(base.charAt(base.length-1)==='/') base = base.slice(0,-1);
        fetch(base + '/info', { method:'GET', credentials:'omit' })
          .then(function(r){ return r.text().then(function(text){ setProbe({ done:true, ok:r.ok, status:r.status, error:null, body:text }); }); })
          .catch(function(e){ setProbe({ done:true, ok:false, status:null, error:String(e), body:null }); });
      }, [wsBase]);

      // connect if ok
      useEffect(function(){
        if(!probe.done || !probe.ok) return;
        var sock = new SockJS(wsBase);
        var client = Stomp.over(sock);
        client.debug = null;
        client.connect({}, function(){
          setConnected(true);
          client.subscribe('/sub/rooms/' + roomId, function(msg){
            try{
              var data = JSON.parse(msg.body) || {};
              // server echo dedupe: if server forwards our own message (by clientId/localId) or same content within TTL, skip
              if (data.clientId && data.clientId === clientId) return; // same tab echo
              var inbound = { id: genId(), sender: data.sender||'unknown', content: data.content||'', ts: nowHHMM() };
              var k = msgKey(inbound);
              if (seenRef.current.has(k)) return; // duplicate within TTL
              seenRef.current.add(k);
              setMessages(function(prev){ return prev.concat([inbound]); });
            }catch(e){ console.error('Bad payload', e); }
          });
        }, function(err){ console.error('STOMP error', err); setConnected(false); });
        return function(){ try{ client.disconnect(function(){});}catch(_){} };
      }, [probe.done, probe.ok, roomId, wsBase]);

      // autoscroll
      useEffect(function(){ if(scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages]);

      function handleSend(){
        var text = (draft||'').trim();
        if(!text) return;
        var optimistic = { id: genId(), sender: me, content: text, ts: nowHHMM(), clientId: clientId };
        // add to seen first to avoid echo duplication
        seenRef.current.add(msgKey(optimistic));
        setMessages(function(prev){ return prev.concat([optimistic]); });
        setDraft('');
        try{
          var sock = new SockJS(wsBase);
          var client = Stomp.over(sock);
          client.debug = null;
          client.connect({}, function(){
            client.send('/pub/messages.send', {}, JSON.stringify({ roomId: roomId, sender: me, content: text, clientId: clientId, localId: optimistic.id }));
            try{ client.disconnect(function(){});}catch(_){}
          });
        }catch(e){ console.error(e); }
      }

      if (probe.done && !probe.ok){
        var reason = '';
        if (probe.status === 403)      reason = '?œë²„ê°€ ?”ì²­??ê±°ë??ˆìŠµ?ˆë‹¤ (403 Forbidden). ë³´ì•ˆ(CORS/CSRF/?œíë¦¬í‹°) ?ëŠ” ?„ë¡???¤ì • ë¬¸ì œ?????ˆìŠµ?ˆë‹¤.';
        else if (probe.status === 404) reason = wsBase + ' ê²½ë¡œê°€ ë§ëŠ”ì§€ ?•ì¸?˜ì„¸?? (ì»¨í…?¤íŠ¸?¨ìŠ¤/?„ë¡??ê²½ë¡œ)';
        else if (probe.error)          reason = '?¤íŠ¸?Œí¬ ?¤ë¥˜: ' + probe.error;
        else                           reason = 'HTTP ?íƒœ: ' + probe.status;
        return React.createElement('div',{className:'flex flex-col h-screen'},[
          React.createElement('header',{key:'h',className:'h-12 border-b border-zinc-800 flex items-center px-3 bg-zinc-950'},
            React.createElement('div',{className:'text-sm font-semibold'},'Room: '+roomId)
          ),
          React.createElement(Notice,{key:'n',title:'?°ê²° ?¤íŒ¨',detail:'?¬ìœ : '+reason+'\n\n'+
            '?•ì¸?˜ì„¸??\n'+
            '1) Spring Security?ì„œ /ws-stomp/**, OPTIONS ë©”ì„œ???ˆìš© ?¬ë?\n'+
            '2) WebSocket ?¤ì •: addEndpoint("/ws-stomp").setAllowedOriginPatterns("*").withSockJS()\n'+
            '3) ?„ë¡??Nginx ??: /ws-stomp ?…ê·¸?ˆì´???„ë¡???¨ìŠ¤ ?¤ì •\n'+
            '4) ì»¨í…?¤íŠ¸?¨ìŠ¤ê°€ ?ˆë‹¤ë©?data-wsë¡??¬ë°”ë¥?ê²½ë¡œ ?„ë‹¬(ex: /myapp/ws-stomp)',
            action: React.createElement('div',{className:'mt-4 text-xs text-zinc-400'},['?„ì¬ wsBase: ',React.createElement('span',{className:'font-mono',key:'w'},wsBase)])
          })
        ]);
      }

      return React.createElement('div',{className:'flex flex-col h-screen bg-zinc-900 text-zinc-100'},[
        React.createElement('header',{key:'h',className:'h-12 border-b border-zinc-800 flex items-center justify-between px-3 bg-zinc-950'},[
          React.createElement('div',{key:'l',className:'text-sm font-semibold'},'Room: '+roomId),
          React.createElement('div',{key:'r',className:'text-xs text-zinc-400'}, connected ? '?°ê²°?? : '?°ê²° ?€ê¸?)
        ]),
        React.createElement('main',{key:'m',ref:scrollRef,className:'flex-1 overflow-y-auto px-4 py-4'},
          messages.map(function(m){
            var mine = m.sender === me;
            return React.createElement('div',{key:m.id,className:'flex '+(mine?'justify-end':'justify-start')+' mb-2'},
              React.createElement('div',{className:'max-w-[70%] px-3 py-2 rounded-2xl '+(mine?'bg-emerald-700 text-white':'bg-zinc-800 text-zinc-100')},[
                React.createElement('div',{key:'c',className:'text-sm'},m.content),
                React.createElement('div',{key:'t',className:'text-[10px] text-zinc-400 mt-1'},m.ts)
              ])
            );
          })
        ),
        React.createElement('footer',{key:'f',className:'border-t border-zinc-800 p-3 bg-zinc-950'},
          React.createElement('div',{className:'flex gap-2 items-end'},[
            React.createElement('textarea',{
              key:'ta',value:draft,onChange:function(e){ setDraft(e.target.value); },
              onKeyDown:function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); handleSend(); } },
              placeholder:'ë©”ì‹œì§€ë¥??…ë ¥?˜ì„¸??..',className:'flex-1 bg-zinc-800 text-zinc-100 rounded-lg p-2 text-sm resize-none outline-none'
            }),
            React.createElement('button',{key:'btn',onClick:handleSend,className:'bg-emerald-700 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg'},'ë³´ë‚´ê¸?)
          ])
        )
      ]);
    }

    document.addEventListener('DOMContentLoaded', function(){
      var container = document.getElementById('app');
      if(!container){ console.error('??#app ì»¨í…Œ?´ë„ˆê°€ ?†ìŠµ?ˆë‹¤'); return; }
      var root = ReactDOM.createRoot(container);
      root.render( React.createElement(ErrorBoundary,null, React.createElement(DMApp,null) ) );
    });

    console.assert(typeof React !== 'undefined', 'React ë¡œë“œ ?¤íŒ¨');
    console.assert(typeof ReactDOM !== 'undefined', 'ReactDOM ë¡œë“œ ?¤íŒ¨');
    console.assert(typeof SockJS !== 'undefined', 'SockJS ë¡œë“œ ?¤íŒ¨');
    console.assert(typeof Stomp !== 'undefined', 'Stomp ë¡œë“œ ?¤íŒ¨');
</script>
