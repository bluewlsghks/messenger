name: Roadmap authentication dependencies
on:
  push:
    branches: [maintenance/roadmap-workbench-20261006]
    paths: [.github/workflows/roadmap-auth-dependencies.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          cat > build.gradle.kts <<'EOF'
          plugins { java }
          repositories { mavenCentral() }
          dependencies {
            implementation(platform("org.springframework.boot:spring-boot-dependencies:4.1.1"))
            implementation("org.bitbucket.b_c:jose4j:0.9.7")
            implementation("io.jsonwebtoken:jjwt-api:0.13.0")
            runtimeOnly("io.jsonwebtoken:jjwt-impl:0.13.0")
            runtimeOnly("io.jsonwebtoken:jjwt-jackson:0.13.0")
          }
          tasks.register<Copy>("exportDeps") { from(configurations.runtimeClasspath); into("build/dependencies") }
          EOF
          bash ./gradlew exportDeps --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: roadmap-auth-dependencies
          path: build/dependencies
          retention-days: 1
