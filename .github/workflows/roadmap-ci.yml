name: Roadmap infrastructure and security
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7.0.43
        ports: ['27017:27017']
      rabbitmq:
        image: rabbitmq:4.3.1
        ports: ['61613:61613']
        env:
          RABBITMQ_DEFAULT_USER: messenger_ci
          RABBITMQ_DEFAULT_PASS: synthetic_ci_broker_secret_42
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.4.6
        ports: ['9200:9200']
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          xpack.license.self_generated.type: basic
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: --memory=2g
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017
      MONGODB_URI: mongodb://127.0.0.1:27017/messenger_roadmap_ci
      APP_AES_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_JWT_SECRET_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_OPERATIONS_TOKEN: synthetic_ci_operations_token_42_not_for_production
      APP_OPENAI_ENABLED: 'false'
      VOICE_STUN_URLS: ''
      APP_BROKER_RELAY_LOGIN: messenger_ci
      APP_BROKER_RELAY_PASSWORD: synthetic_ci_broker_secret_42
      MESSENGER_E2E_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Initialize isolated external services and database tools
        run: |
          docker exec '${{ job.services.rabbitmq.id }}' rabbitmq-plugins enable rabbitmq_stomp
          mkdir -p /tmp/messenger-tools
          for tool in mongodump mongorestore mongosh; do docker cp -L '${{ job.services.mongo.id }}:/usr/bin/'"$tool" /tmp/messenger-tools/; done
          chmod +x /tmp/messenger-tools/*
          echo /tmp/messenger-tools >> "$GITHUB_PATH"
          for i in $(seq 1 90); do curl -fs http://127.0.0.1:9200/_cluster/health && break; sleep 1; done
          curl -fs http://127.0.0.1:9200/_cluster/health
          curl -fs http://127.0.0.1:9200/_license | python3 -c 'import json,sys; assert json.load(sys.stdin)["license"]["type"] == "basic", "Only the Basic license is allowed"'
      - name: Build, Java and MongoDB regressions
        run: bash ./gradlew test bootJar dependencyCoordinates --no-daemon
      - name: JavaScript and offline operations checks
        run: |
          node --test src/test/js/*.cjs
          python3 -m unittest discover -s src/test/ops -v
          python3 -m unittest discover -s src/test/deployment -v
          python3 scripts/validate/backup_restore.py
      - name: Install browser
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Single and multi-instance browser, real broker/search, media and soak
        run: bash scripts/validate/ci_scenarios.sh
      - name: Resolved dependency security audit
        if: always()
        run: python3 scripts/ops/security_audit.py build/security/dependencies.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roadmap-validation
          path: |
            build/reports/tests/
            build/test-results/
            build/e2e-artifacts/
            build/backup-test/result.json
            build/security/
            build/*server.log
            build/cluster-*.log
          if-no-files-found: warn
